# Quality gates for scripts/quality-gates.sh — one `gate=command` per line, run with bash.
#   empty  = not configured yet (fails under QUALITY_GATES_STRICT=1, i.e. team/high-security)
#   none   = not applicable to this stack
# $PYTHON is set to a working Python 3 launcher. Start a new project with:
#   bash scripts/quality-gates.sh --detect
# These values check the template itself; replace them with your project's commands.
test=$PYTHON -m unittest discover -s scripts/tests -p "test_*.py" && bash scripts/tests/test_hooks.sh
lint=$PYTHON scripts/validate_template.py && for f in .claude/hooks/*.sh scripts/*.sh scripts/tests/*.sh scripts/git-hooks/*; do bash -n "$f" || exit 1; done
typecheck=none
build=none
security=
