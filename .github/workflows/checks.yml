name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Mandatory, stack-agnostic: needs only bash, git and Python's stdlib.
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (tracked files)
        run: bash .claude/hooks/scan-secrets.sh --all
      - name: Validate Claude Code config
        run: python3 scripts/validate_template.py
      - name: Test validator
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Test hooks
        run: bash scripts/tests/test_hooks.sh

  # Optional, project-specific: runs your stack's audit tool if a manifest exists.
  # Add a setup step for your toolchain (setup-node, setup-python, ...) so the tool
  # is installed; without it the script skips and passes.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit
        run: bash scripts/check-deps.sh

  # Add your project's own jobs below (build, test, lint) using CLAUDE.md's Commands.
